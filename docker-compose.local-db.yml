# Override opcional: Postgres local en contenedor en lugar de Supabase.
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up --build
services:
  db:
    image: postgres:16-alpine
    container_name: turnos-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria para la base local}
      - POSTGRES_DB=${POSTGRES_DB:-turnos}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-turnos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-turnos}
      - DB_SSL=disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
