services:
  db:
    image: postgres:16-alpine
    container_name: turnos-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=REDACTED
      - POSTGRES_DB=turnos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: turnos-backend
    ports:
      - "5000:5000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-REDACTED}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-8h}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-REDACTED}
      - PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/turnos
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5000}
    container_name: turnos-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
