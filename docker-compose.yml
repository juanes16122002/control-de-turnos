# Base de datos: Supabase (PostgreSQL administrado). Define DATABASE_URL en .env.
#   docker compose up --build
#
# ¿Prefieres Postgres local en un contenedor (desarrollo sin internet)? Agrega el override:
#   docker compose -f docker-compose.yml -f docker-compose.local-db.yml up --build
services:
  backend:
    build: ./backend
    container_name: turnos-backend
    ports:
      - "5000:5000"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET es obligatoria. Define las variables en un archivo .env (ver .env.example)}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - REFRESH_IDLE_HOURS=${REFRESH_IDLE_HOURS:-12}
      - SESSION_MAX_DAYS=${SESSION_MAX_DAYS:-7}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:?ADMIN_PASS es obligatoria. Define las variables en un archivo .env (ver .env.example)}
      - PORT=5000
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL es obligatoria. Usa la cadena de conexión de Supabase (ver .env.example)}
      - DB_SSL=${DB_SSL:-}
      - DB_SSL_CA=${DB_SSL_CA:-}
      - DB_POOL_MAX=${DB_POOL_MAX:-10}
      - TRUST_PROXY=${TRUST_PROXY:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5000}
    container_name: turnos-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
